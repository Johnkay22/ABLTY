name: Profiles entitlement lock PostgreSQL integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/postgres-profiles-entitlement-lock.sh'
      - '.github/workflows/profiles-entitlement-lock-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entitlement-lock-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL server and client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Run disposable PostgreSQL entitlement lock tests
        shell: bash
        run: |
          set +e
          tests/postgres-profiles-entitlement-lock.sh
          status=$?
          set -e
          if [ "$status" -eq 77 ]; then
            echo "PostgreSQL harness skipped; required binaries were not installed." >&2
            exit 1
          fi
          exit "$status"
