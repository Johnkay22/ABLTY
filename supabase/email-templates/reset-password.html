<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your ABLTY password</title>
</head>
<body style="margin:0;padding:0;background-color:#0e1012;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0e1012;">
    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr><td align="center" style="padding-bottom:32px;"><span style="font-family:'Courier New',Courier,monospace;font-size:22px;font-weight:700;letter-spacing:6px;color:#f0f2f4;">ABLTY</span></td></tr>
        <tr><td style="background-color:#161a1e;border:1px solid #2a2f35;border-radius:16px;padding:40px 32px;">
          <h1 style="margin:0 0 16px;font-size:28px;color:#f0f2f4;line-height:1.2;">Reset your password</h1>
          <p style="margin:0 0 32px;font-size:15px;color:#aeb4bc;line-height:1.65;">Use the button below to choose a new password for your ABLTY account.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:10px;background-color:#4af0c8;">
            <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 32px;font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#000;text-decoration:none;font-weight:700;">Reset Password</a>
          </td></tr></table>
          <hr style="border:none;border-top:1px solid #2a2f35;margin:32px 0 24px;">
          <p style="margin:0 0 8px;font-size:12px;color:#8a9099;line-height:1.6;">If the button does not work, copy and paste this link into your browser:</p>
          <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:11px;color:#4af0c8;word-break:break-all;">{{ .ConfirmationURL }}</p>
        </td></tr>
        <tr><td align="center" style="padding-top:24px;"><p style="margin:0;font-size:11px;color:#707984;line-height:1.6;">If you did not request a password reset, you can safely ignore this email.</p></td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
